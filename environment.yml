name: tsam_env
channels:
  - conda-forge
# Every dependency below is mirrored in pyproject.toml so that the conda and
# the PyPI environment resolve to the same package set. Renovate resolves both
# files via conda-forge (see .github/renovate.json) and groups them into a
# single PR, so a bump only lands once the release exists on both channels.
# When adding or removing a dep here, mirror the change in pyproject.toml AND
# update the package list in .github/renovate.json (regex alternation +
# pep621 disable rule).
# The only intentional exceptions are `python`, `pip` and `d2` (see below),
# which have no pyproject.toml counterpart.
dependencies:
  - python>=3.10,<=3.14.7
  - pip
  # Core dependencies
  - scikit-learn >=1.3.0,<=1.9.0
  - scipy >=1.9.0,<=1.18.0
  - pandas >=2.2.0,<=3.0.5
  - numpy >=1.22.4,<=2.4.6
  - pyomo >=6.4.3,<=6.10.1
  - tqdm >=4.21.0,<=4.70.0
  - highspy >=1.7.2,<=1.15.1
  - plotly >=5.0.0,<=6.9.0
  - notebook >=7.5.0,<=7.6.2
  # Testing
  - pytest <=9.1.1
  - pytest-cov <=7.1.0
  - pytest-xdist <=3.8.0
  - pytest-benchmark <=5.2.3
  - codecov <=2.1.13
  - nbval <=0.11.0
  # nbclient and nbformat are imported directly by scripts/execute_notebooks.py.
  # Keep comments on their own line: Renovate's environment.yml matcher would
  # otherwise capture a trailing inline comment as part of the version range.
  - nbclient <=0.11.0
  - nbformat <=5.11.1
  # Documentation
  - mkdocs >=1.6,<=1.6.1
  - mkdocs-material >=9.5,<=9.7.7
  - mkdocstrings-python >=0.27,<=2.0.7
  - mkdocs-jupyter >=0.25,<=0.25.1
  - mkdocs-gen-files >=0.5,<=0.6.1
  - mkdocs-literate-nav >=0.6,<=0.6.3
  # d2 renders the architecture diagrams in docs/assets/architecture. It is a
  # Go binary that is only packaged on conda-forge, so it has deliberately no
  # pyproject.toml counterpart.
  - d2
  # Linting and formatting
  - ruff <=0.16.4
  - mypy <=2.3.1
  - pre-commit <=4.6.2
  - pandas-stubs <=3.0.5.260730
