# pre-commit.ci is enabled on this repo; Renovate also manages hook revs via the
# pre-commit manager (see .github/renovate.json). `autoupdate_schedule: quarterly`
# is the longest interval pre-commit.ci accepts and makes it effectively a safety
# net behind Renovate's weekly run. To disable pre-commit.ci autoupdates entirely,
# toggle it off in the pre-commit.ci dashboard (no config-only option exists).
ci:
  autoupdate_schedule: quarterly
  # The mypy hook below runs as a `repo: local` / system hook against the
  # project's own environment, which pre-commit.ci cannot install. Skip it
  # there; the "Pre-commit" GitHub Actions job runs mypy with `.[develop]`
  # installed instead.
  skip: [mypy]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # docs/changelog.md is a symlink to ../CHANGELOG.md. On Windows checkouts
      # without symlink support it appears as a text file containing the target
      # path; whitespace hooks would then "fix" it by appending a newline,
      # corrupting the symlink target on Linux. Exclude it from both hooks.
      - id: trailing-whitespace
        exclude: ^docs/changelog\.md$
      - id: end-of-file-fixer
        exclude: ^docs/changelog\.md$
      - id: check-yaml
        args: ['--unsafe']
      - id: check-added-large-files
        args: ['--maxkb=4000']
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # mypy runs as a local/system hook against the project's own environment
  # rather than pre-commit's isolated venv. This keeps mypy, pandas-stubs and
  # numpy on the single versions pinned in pyproject.toml (the [develop] extra
  # and runtime deps) — no duplicated pins, no rev to bump. The isolated-venv
  # approach previously installed an unconstrained numpy (2.5.x) whose PEP 695
  # stubs broke mypy under our python_version = "3.10" target.
  #
  # Requires `.[develop]` in the active env: CI installs it before running
  # pre-commit, and pre-commit.ci skips this hook (see `ci.skip` above).
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types_or: [python, pyi]
        require_serial: true
        args: [--ignore-missing-imports]
        exclude: ^(docs/|test/|benchmarks/)

  - repo: local
    hooks:
      # Fail if a src/tsam module is added without a docs/api reference (or an
      # explicit allowlist entry). The script scans the whole tree itself.
      - id: check-api-reference
        name: check API reference coverage
        entry: python docs/scripts/check_api_reference.py
        language: system
        pass_filenames: false
        files: ^(src/tsam/.*\.py|docs/.*\.md)$
