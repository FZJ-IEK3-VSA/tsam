# Renovate manages the hook revs below via its pre-commit manager
# (see .github/renovate.json).

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
      - id: check-added-large-files
        args: ['--maxkb=4000']
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  # ruff-pre-commit v0.16.5 added `markdown` to the ruff-format hook's
  # `types_or`, so `ruff format` now also formats the Python code blocks
  # embedded in Markdown (a ruff capability that has been on by default since
  # ruff 0.16.0). That behaviour is intentional here: the snippets in
  # README.md and docs/migration/ are checked like any other Python.
  # CHANGELOG.md is regenerated by release-please, so a release can reintroduce
  # unformatted snippets; this hook then fixes them on the next commit.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      # `ruff` is the deprecated alias for `ruff-check` and still prints as
      # "ruff (legacy alias)" in CI logs; use the current id.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # mypy runs as a local/system hook against the project's own environment
  # rather than pre-commit's isolated venv. This keeps mypy, pandas-stubs and
  # numpy on the single versions pinned in pyproject.toml (the [develop] extra
  # and runtime deps) — no duplicated pins, no rev to bump. The isolated-venv
  # approach previously installed an unconstrained numpy (2.5.x) whose PEP 695
  # stubs broke mypy under our python_version = "3.10" target.
  #
  # Requires `.[develop]` in the active env; the "Pre-commit" CI job installs
  # it before running pre-commit.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types_or: [python, pyi]
        require_serial: true
        args: [--ignore-missing-imports]
        exclude: ^(docs/|test/|benchmarks/)

  - repo: local
    hooks:
      # Fail if a src/tsam module is added without a docs/api reference (or an
      # explicit allowlist entry). The script scans the whole tree itself.
      - id: check-api-reference
        name: check API reference coverage
        entry: python docs/scripts/check_api_reference.py
        language: system
        pass_filenames: false
        files: ^(src/tsam/.*\.py|docs/.*\.md)$
